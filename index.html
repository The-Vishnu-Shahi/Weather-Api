<!DOCTYPE html> 
<html lang="en"> 
  <head> 
    <meta charset="UTF-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <title>Document</title> 
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script> 
  </head> 
  <body style="background-color: black"> 
    <center style="margin-top: 50px"> 
      <div 
        class="max-w-xs overflow-hidden rounded-lg shadow-lg bg-gray-950 text-gray-50 border border-white" 
      > 
        <div 
          class="flex items-end justify-end h-32 p-4 dark:bg-gray-500 bg-center bg-cover" 
          style=" 
            background-image: url(https://source.unsplash.com/300x150/?skyline); 
          " 
        > 
          <input 
            class="text-center input text-white border border-white rounded-lg" 
            placeholder="Enter City" 
            type="text" 
            name="" 
            id="inp" 
          /> 
 
          <p 
            class="px-2 py-1 text-sm tracking-widest dark:text-gray-800 uppercase dark:bg-gray-100 bg-opacity-75 rounded shadow-lg" 
            id="cityDisplay" 
          > 
            Miami 
          </p> 
        </div> 
        <div class="flex justify-between p-4"> 
          <div class="flex flex-col flex-1 gap-4"> 
            <div class="flex justify-between"> 
              <div class="flex gap-2"> 
                <span class="text-5xl font-semibold" id="temp">36°</span> 
                <span class="text-lg dark:text-gray-600">
                   28°</span> 
              </div> 
                    <img src="" alt="img" id="img"> 
            </div> 
            <p class="text-sm"> 
              Mostly sunny throughout the day. <br>6-10 KPH winds. 
            </p> 
          </div> 
          
        </div> 
        <div 
          class="flex items-center justify-between gap-8 p-4 border-t dark:text-gray-600 dark:border-gray-300" 
        > 
          <div class="flex items-center space-x-1"> 
            <span class="font-bold">8</span> 
            <span class="text-sm">UV</span> 
          </div> 
          <div class="flex items-center space-x-1"> 
            <span class="font-bold">5%</span> 
            <span class="text-sm">Precip</span> 
          </div> 
          <div class="flex items-center space-x-1"> 
            <span class="font-bold">14°</span> 
            <span class="text-sm">Dew Point</span> 
          </div> 
        </div> 
      </div> 
    </center> 
  </body> 
  <script src="index.js"></script> 
</html>
